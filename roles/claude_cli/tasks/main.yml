---
- name: Ensure prerequisite packages
  apt:
    name: ["ca-certificates", "curl", "gnupg"]
    state: present
    update_cache: true

- name: Add NodeSource GPG key
  apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Add NodeSource 20.x repo
  apt_repository:
    repo: "deb https://deb.nodesource.com/node_20.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Claude Code CLI globally
  npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present

- name: Verify claude CLI is installed
  command: claude --version
  register: claude_version
  changed_when: false

- name: Show installed version
  debug:
    var: claude_version.stdout

- name: Write CLAUDE_CODE_OAUTH_TOKEN for root shells (headless auth)
  copy:
    dest: /etc/profile.d/claude-code-env.sh
    content: |
      export CLAUDE_CODE_OAUTH_TOKEN="{{ claude_code_oauth_token }}"
    mode: "0600"
  when: claude_code_oauth_token | length > 0
  no_log: true
