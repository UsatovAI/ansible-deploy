[claude_vps]
212.34.144.28 ansible_python_interpreter=/usr/bin/python3

# The box this control repo itself lives on -- also the LIVE production
# claudeweb console (systemd claude-web.service, /opt/claude-web), separate
# from claude_vps above (a throwaway test target used only to validate this
# playbook per AGENT-32's acceptance criteria). Kept as its own group so a
# plain `ansible-playbook playbook.yml`/`console_deploy.yml` run against
# claude_vps can never accidentally also touch prod.
[claudeweb_prod]
127.0.0.1 ansible_connection=local ansible_python_interpreter=/usr/bin/python3
